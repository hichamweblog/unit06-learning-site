<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('unit06_theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10243b" />
    <title>منهاج | العلوم الإسلامية للبكالوريا</title>
    <meta name="description" content="منصة مراجعة للعلوم الإسلامية في البكالوريا الجزائرية: دروس مُراجعة، خرائط ذهنية، بطاقات استرجاع، بنك أسئلة، وتدريبات بكالوريا مع تصحيح." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/Tajawal-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/NotoSansArabic-Regular.ttf" as="font" type="font/ttf" crossorigin />

</html>
